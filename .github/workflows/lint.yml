---
name: Lint

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install linters
        run: pip3 install ansible-core ansible-lint yamllint -r scripts/requirements-docs.txt

      - name: Install collections
        run: ansible-galaxy collection install community.rabbitmq ansible.posix

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Test the argument_specs check
        run: tests/spec-check/run.sh

      - name: Check argument_specs are complete
        run: scripts/check-specs.py

      - name: Check role READMEs are up to date
        run: |
          scripts/generate-docs.sh
          git status --porcelain -- roles
          git diff -- roles
          test -z "$(git status --porcelain -- roles)"

      - name: Install the collection
        run: ansible-galaxy collection install .

      - name: Check examples
        run: scripts/check-examples.py
