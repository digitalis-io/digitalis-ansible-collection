---
# One PostgreSQL node managed by Patroni with a local pgBackRest repository.
# The smallest setup that exercises the whole role; use it to try the role or
# for development. There is no failover with one node.
#
# The passwords are read from the environment of the controller:
#   export PG_SUPERUSER_PASSWORD=...
#   export PG_REPLICATION_PASSWORD=...
#   export PG_REWIND_PASSWORD=...
#   export PG_APP_PASSWORD=...
- name: Install a single PostgreSQL node
  hosts: postgres_cluster
  become: true
  roles:
    - role: digitalis.digitalis.postgres_cluster
      vars:
        postgres_cluster_version: 16
        postgres_cluster_name: demo
        postgres_cluster_superuser_password: "{{ lookup('ansible.builtin.env', 'PG_SUPERUSER_PASSWORD') }}"
        postgres_cluster_replication_password: "{{ lookup('ansible.builtin.env', 'PG_REPLICATION_PASSWORD') }}"
        postgres_cluster_rewind_password: "{{ lookup('ansible.builtin.env', 'PG_REWIND_PASSWORD') }}"
        postgres_cluster_pgbackrest_repo_path: /var/lib/pgbackrest
        postgres_cluster_parameters:
          max_connections: 200
          shared_buffers: 1GB
        postgres_cluster_hba:
          - host appdb app 10.0.0.0/24 scram-sha-256
        postgres_cluster_users:
          - name: app
            password: "{{ lookup('ansible.builtin.env', 'PG_APP_PASSWORD') }}"
        postgres_cluster_databases:
          - name: appdb
            owner: app
