---
- name: Validate role variables
  ansible.builtin.assert:
    that:
      - rabbitmq_admin_password | length > 0
      - rabbitmq_plugins is not string
      - rabbitmq_plugins | length == 0 or 'rabbitmq_management' in rabbitmq_plugins
      - rabbitmq_cluster_members | length < 2 or rabbitmq_erlang_cookie | length > 0
      - rabbitmq_oauth2_issuer is not defined or (rabbitmq_oauth2_client_id is defined and rabbitmq_oauth2_client_secret is defined)
      - not (rabbitmq_use_longname | default(false)) or (rabbitmq_domain is defined and rabbitmq_domain | length > 0) or ansible_domain | length > 0
      - ansible_os_family != 'Debian' or ansible_distribution_release in rabbitmq_erlang_version_map
    fail_msg: >-
      rabbitmq_admin_password must be set; rabbitmq_plugins must be a list including rabbitmq_management;
      clusters need rabbitmq_erlang_cookie; OAuth2 needs client_id and client_secret;
      longname mode requires rabbitmq_domain or a resolvable FQDN;
      ansible_distribution_release is not in rabbitmq_erlang_version_map, add an entry before deploying
    quiet: true
  tags:
    - always

- name: Compute effective node name
  ansible.builtin.set_fact:
    _rabbitmq_nodename: >-
      {{ ('rabbit@' ~ ansible_hostname ~ '.' ~ (rabbitmq_domain | default(ansible_domain) | default('internal')))
         if rabbitmq_use_longname | default(false)
         else rabbitmq_nodename }}
  tags:
    - always

- name: Resolve effective plugin list
  ansible.builtin.set_fact:
    _rabbitmq_plugins: >-
      {{ rabbitmq_plugins
         + (['rabbitmq_auth_backend_oauth2']
            if (rabbitmq_oauth2_issuer is defined and rabbitmq_oauth2_issuer != ""
                and 'rabbitmq_auth_backend_oauth2' not in rabbitmq_plugins)
            else []) }}
  tags:
    - always

- name: OS config
  tags:
    - os_config
  block:
    - name: Set file descriptor limits for rabbitmq
      ansible.builtin.copy:
        dest: /etc/security/limits.d/rabbitmq.conf
        content: |
          rabbitmq soft nofile {{ rabbitmq_file_limits }}
          rabbitmq hard nofile {{ rabbitmq_file_limits }}
        mode: "0644"

    - name: Apply sysctl tuning
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
      loop: "{{ rabbitmq_sysctl | dict2items }}"
      when: not ansible_virtualization_type == 'docker'

- name: Set up for RedHat
  ansible.builtin.include_tasks: setup-RedHat.yml
  when: ansible_os_family == 'RedHat'

- name: Set up for Debian
  ansible.builtin.include_tasks: setup-Debian.yml
  when: ansible_os_family == 'Debian'

- name: RabbitMQ system config
  tags:
    - rabbitmq
    - system_config
  block:
    - name: Create systemd service override directory
      ansible.builtin.file:
        state: directory
        path: /etc/systemd/system/rabbitmq-server.service.d
        mode: "0755"
        owner: root

    - name: Write systemd service override for file limits
      ansible.builtin.template:
        dest: /etc/systemd/system/rabbitmq-server.service.d/limits.conf
        src: service_override.conf.j2
        mode: "0644"
      notify: Reload systemd daemon

- name: Generate self-signed TLS certificates
  ansible.builtin.import_tasks: tls.yml
  when: rabbitmq_ssl is defined and rabbitmq_ssl.self_signed | default(false)
  tags:
    - rabbitmq
    - tls

- name: RabbitMQ main config
  tags:
    - rabbitmq
    - config
  block:
    - name: Get Erlang SSL library path
      ansible.builtin.command:
        cmd: >-
          erl -noinput
          -eval 'io:format("ERL_SSL_PATH=~s~n", [filename:dirname(code:which(inet_tls_dist))])'
          -s init stop
      register: rabbitmq_cmd_erlang_ssl_path
      changed_when: false
      when: rabbitmq_ssl is defined

    - name: Save Erlang SSL path fact
      ansible.builtin.set_fact:
        rabbitmq_erlang_ssl_path: "{{ rabbitmq_cmd_erlang_ssl_path.stdout }}"
      when: rabbitmq_ssl is defined

    - name: Write inter-node TLS config
      ansible.builtin.template:
        dest: /etc/rabbitmq/inter_node_tls.config
        src: inter_node_tls.config.j2
        mode: "0644"
        owner: rabbitmq
        group: rabbitmq
      when: rabbitmq_ssl is defined
      notify: Restart rabbitmq

    - name: Write advanced config
      ansible.builtin.template:
        dest: /etc/rabbitmq/advanced.config
        src: advanced.config.j2
        mode: "0644"
        owner: rabbitmq
        group: rabbitmq
      notify: Restart rabbitmq

    - name: Write Erlang cookie
      ansible.builtin.copy:
        dest: "{{ rabbitmq_home | default('/var/lib/rabbitmq') }}/.erlang.cookie"
        content: "{{ rabbitmq_erlang_cookie }}"
        owner: rabbitmq
        group: rabbitmq
        mode: "0400"
      when: rabbitmq_erlang_cookie is defined and rabbitmq_erlang_cookie != ""
      no_log: true
      notify: Restart rabbitmq

    - name: Write rabbitmq.conf
      ansible.builtin.template:
        dest: /etc/rabbitmq/rabbitmq.conf
        src: rabbitmq.conf.j2
        mode: "0644"
      notify: Restart rabbitmq

    - name: Write rabbitmq-env.conf
      ansible.builtin.template:
        dest: /etc/rabbitmq/rabbitmq-env.conf
        src: rabbitmq-env.conf.j2
        mode: "0644"
      notify: Restart rabbitmq

- name: Enable RabbitMQ plugins
  tags: plugins
  ansible.builtin.copy:
    dest: /etc/rabbitmq/enabled_plugins
    content: "[{{ _rabbitmq_plugins | join(',') }}]."
    mode: "0644"
    owner: rabbitmq
    group: rabbitmq
  when: _rabbitmq_plugins | length > 0
  notify: Restart rabbitmq

- name: Ensure RabbitMQ is started and enabled
  ansible.builtin.systemd:
    name: "{{ rabbitmq_daemon }}"
    state: "{{ rabbitmq_state }}"
    enabled: "{{ rabbitmq_enabled }}"

- name: Flush handlers before configuring RabbitMQ
  ansible.builtin.meta: flush_handlers

- name: Create RabbitMQ vhosts
  tags: vhosts
  ansible.builtin.import_tasks: vhosts.yml

- name: Create RabbitMQ users
  tags: users
  ansible.builtin.import_tasks: users.yml

- name: Create RabbitMQ queues
  tags: queues
  ansible.builtin.import_tasks: queues.yml
  when: rabbitmq_queues is defined and rabbitmq_queues | length > 0

- name: Create backup cronjob
  tags: backups
  ansible.builtin.import_tasks: backups.yml

- name: Download rabbitmqadmin CLI
  tags: rabbitmqadmin
  ansible.builtin.get_url:
    url: "https://github.com/rabbitmq/rabbitmqadmin-ng/releases/download/v{{ rabbitmq_admin_version }}/rabbitmqadmin-{{ rabbitmq_admin_version }}-{{ ansible_architecture }}-unknown-linux-gnu"
    dest: /usr/local/bin/rabbitmqadmin
    mode: "0755"

- name: Install and configure HAProxy
  tags: haproxy
  when: rabbitmq_use_haproxy | bool
  block:
    - name: Install haproxy package
      ansible.builtin.package:
        name: haproxy

    - name: Write HAProxy config
      ansible.builtin.template:
        dest: /etc/haproxy/haproxy.cfg
        src: haproxy_rabbitmq.cfg.j2
        mode: "0644"
        validate: haproxy -c -f %s
      notify: Restart haproxy

    - name: Ensure HAProxy is started
      ansible.builtin.systemd:
        name: haproxy
        state: started
        enabled: true
