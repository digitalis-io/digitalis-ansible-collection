---
argument_specs:
  main:
    short_description: Install and configure OpenBao Agent.
    description:
      - Installs OpenBao, configures OpenBao Agent with auto-auth and file
        templates, and runs it as a systemd service.
      - Changes to credentials, copied template files, the agent configuration
        or the systemd unit restart the agent, which re-renders every template
        on start. No restart is issued when O(openbao_agent_service_state) is
        V(stopped).
    author: Digitalis.io
    options:
      openbao_agent_install:
        type: bool
        default: true
        description:
          - Install the OpenBao package, which provides the C(bao) binary, by
            calling the C(openbao) role from this collection.
          - Set to V(false) when C(bao) is installed by other means. When V(true),
            C(openbao_version) and the C(openbao) repository variables are
            passed through unchanged. The C(openbao) server service is never
            started or changed by this role.
      openbao_agent_user:
        type: str
        default: openbao-agent
        description:
          - System user the agent runs as. Created by the role without a home
            directory or login shell.
          - Kept separate from the C(openbao) server user so the agent and its
            exec commands cannot read server storage on hosts running both.
          - Changing it does not remove the previous user.
      openbao_agent_group:
        type: str
        default: openbao-agent
        description:
          - System group the agent runs as. Owns the configuration directory
            and the data directory.
          - Set it to the group of the service consuming the rendered files so
            that service can read them and their parent directories.
      openbao_agent_config_dir:
        type: path
        default: /etc/openbao-agent
        description:
          - Directory for C(agent.hcl), the AppRole or token credential files
            and the C(templates) subdirectory holding copied C(src) files.
          - Owned by root, group O(openbao_agent_group), mode V(0750).
          - Changing it rewrites the configuration and restarts the agent.
            The old directory is not removed, so its credential files stay
            on the host; delete them manually when the directory moves.
      openbao_agent_data_dir:
        type: path
        default: /var/lib/openbao-agent
        description:
          - Agent working directory holding the PID file and, by default, the
            token sink. Owned by O(openbao_agent_user), mode V(0750).
          - It is the only path the systemd unit can write to besides the
            token sink and template destination directories.
      openbao_agent_service_name:
        type: str
        default: openbao-agent
        description:
          - Name of the systemd unit, without the C(.service) suffix. The unit
            file is written to C(/etc/systemd/system/<name>.service).
          - Changing it creates a new unit. The previous unit is not stopped
            or removed.
      openbao_agent_service_enabled:
        type: bool
        default: true
        description: Start the agent service at boot.
      openbao_agent_service_state:
        type: str
        default: started
        choices: [started, stopped, restarted]
        description:
          - Desired state of the agent service.
          - V(started) starts the service if it is not running. Configuration
            changes still restart it through a handler.
          - V(stopped) stops the service and suppresses handler restarts.
          - V(restarted) restarts the service on every run, so the play is
            never idempotent.
      openbao_agent_address:
        type: str
        default: ""
        description:
          - URL of the OpenBao server, for example V(https://openbao.example.com:8200).
          - Required. Must start with C(http://) or C(https://); an empty value
            or a missing scheme fails validation before any change is made.
      openbao_agent_ca_cert:
        type: str
        default: ""
        description:
          - Path on the managed host to a PEM CA bundle used to verify the
            server certificate. The role does not copy the file.
          - Empty uses the system trust store.
      openbao_agent_tls_server_name:
        type: str
        default: ""
        description:
          - Server name sent for SNI and used to verify the server certificate,
            for example when connecting by IP address or through a load balancer.
          - Empty uses the host name from O(openbao_agent_address).
      openbao_agent_tls_skip_verify:
        type: bool
        default: false
        description:
          - Disable verification of the server certificate. Exposes the agent
            and its credentials to man-in-the-middle attacks.
          - Do not use in production; prefer O(openbao_agent_ca_cert).
      openbao_agent_retry_num_retries:
        type: int
        default: 12
        description:
          - How many times the agent retries a failed request to the server
            before giving up.
          - Once retries are exhausted template rendering fails, which stops
            the agent when O(openbao_agent_template_exit_on_retry_failure) is V(true).
      openbao_agent_log_level:
        type: str
        default: info
        choices: [trace, debug, info, warn, error]
        description:
          - Agent log verbosity, written to the systemd journal.
          - C(trace) and C(debug) are very verbose; use them only while
            troubleshooting.
      openbao_agent_auth_method:
        type: str
        default: approle
        choices: [approle, token_file]
        description:
          - Auto-auth method the agent uses to obtain a token.
          - V(approle) needs O(openbao_agent_approle_role_id) and
            O(openbao_agent_approle_secret_id). V(token_file) needs
            O(openbao_agent_token). The credentials for the other method are
            ignored.
          - Changing the method rewrites the configuration and restarts the agent.
      openbao_agent_auth_mount_path:
        type: str
        default: "auth/{{ openbao_agent_auth_method if openbao_agent_auth_method != 'token_file' else 'token' }}"
        description:
          - Mount path of the auth method on the server, for example
            V(auth/approle-apps) when AppRole is mounted at a custom path.
          - Defaults to V(auth/approle) for the approle method. Only used by the
            approle method; the token_file method ignores it, so the
            V(auth/token) default it would resolve to has no effect.
      openbao_agent_approle_role_id:
        type: str
        default: ""
        no_log: true
        description:
          - AppRole role ID. Required, non-empty, for the approle method.
          - Written to C(<config_dir>/role_id) with mode V(0600) owned by
            O(openbao_agent_user). A change restarts the agent. Keep the value
            in ansible-vault or a secrets manager.
      openbao_agent_approle_secret_id:
        type: str
        default: ""
        no_log: true
        description:
          - AppRole secret ID. Required, non-empty, for the approle method.
          - Written to C(<config_dir>/secret_id) with mode V(0600) owned by
            O(openbao_agent_user). The agent does not delete the file after
            reading it. A change restarts the agent. Keep the value in
            ansible-vault or a secrets manager.
      openbao_agent_token:
        type: str
        default: ""
        no_log: true
        description:
          - Token the agent uses with the token_file method. Required,
            non-empty, for that method.
          - Written to C(<config_dir>/token) with mode V(0600) owned by
            O(openbao_agent_user). A change restarts the agent. Keep the value
            in ansible-vault or a secrets manager.
      openbao_agent_token_sink_enabled:
        type: bool
        default: true
        description:
          - Write the auto-auth token to the file at O(openbao_agent_token_sink_path)
            so local processes can use it.
          - Anything that can read the sink holds a valid token; restrict access
            with O(openbao_agent_token_sink_mode) and O(openbao_agent_group).
      openbao_agent_token_sink_path:
        type: path
        default: "{{ openbao_agent_data_dir }}/agent-token"
        description:
          - Absolute path of the token sink file.
          - The agent writes it at runtime, so a path outside
            O(openbao_agent_data_dir) must be in a directory that already
            exists and is writable by O(openbao_agent_user). The systemd unit
            adds that directory to its writable paths.
          - Defaults to C(<data_dir>/agent-token). Ignored when
            O(openbao_agent_token_sink_enabled) is V(false).
      openbao_agent_token_sink_mode:
        type: str
        default: "0640"
        description:
          - File mode of the token sink as a four digit octal string, for
            example V(0600). Quote it so YAML does not read it as a number.
          - Anything else fails validation.
      openbao_agent_listener_address:
        type: str
        default: ""
        description:
          - Address for a local API proxy listener that injects the agent token
            into requests, for example V(127.0.0.1:8100). Enabling it also
            turns on the agent cache.
          - Empty disables the listener. The listener has no TLS, so only
            loopback addresses are accepted unless
            O(openbao_agent_listener_allow_nonlocal) is V(true).
      openbao_agent_listener_allow_nonlocal:
        type: bool
        default: false
        description:
          - Accept a non-loopback O(openbao_agent_listener_address).
          - Any client that can reach the listener is served with the agent
            token and no TLS. Only enable it on a trusted, firewalled network.
      openbao_agent_template_default_perms:
        type: str
        default: "0600"
        description:
          - File mode, as a four digit octal string, for rendered files whose
            template item does not set C(perms).
          - Rendered files are owned by O(openbao_agent_user) and
            O(openbao_agent_group), so use V(0640) for a consuming service in
            that group.
      openbao_agent_template_exit_on_retry_failure:
        type: bool
        default: true
        description:
          - Exit the agent when rendering a template fails after the retries in
            O(openbao_agent_retry_num_retries) are used up.
          - With V(true), systemd restarts the agent after five seconds, so a
            server outage surfaces as restarts instead of stale files. With
            V(false) the agent keeps running and leaves the last rendered file.
      openbao_agent_template_static_secret_render_interval:
        type: str
        default: 5m
        description:
          - How often secrets without a lease, such as KV, are fetched again
            and the templates re-rendered. Go duration string, for example
            V(30s), V(5m) or V(1h).
          - Leased secrets are re-rendered when they renew. A shorter interval
            picks up rotated secrets sooner at the cost of more server requests.
            A changed file triggers the item's C(exec_command).
      openbao_agent_templates:
        type: list
        elements: dict
        default: []
        description:
          - Templates the agent renders to files. Each item needs C(destination)
            and exactly one of C(contents), C(src) or C(source).
          - Optional keys are C(perms), C(error_on_missing_key), C(backup),
            C(create_dest_dirs), C(left_delimiter), C(right_delimiter),
            C(wait_min), C(wait_max), C(exec_command) and C(exec_timeout).
            Unknown keys fail validation. See the README for each key.
          - Tag inline C(contents) with C(!unsafe) so Ansible leaves the
            double curly brace markers for the agent.
          - Destinations must be absolute, unique and not directly in C(/),
            C(/etc), C(/usr), C(/var) or C(/boot). Missing destination
            directories are created for O(openbao_agent_user); existing ones
            are left unchanged.
          - C(src) files are copied from the controller to C(<config_dir>/templates/)
            and must have unique base names. Adding, removing or changing an
            item rewrites the configuration and restarts the agent.
          - Items that set C(exec_command) run it after a render changes the file.
      openbao_agent_extra_config:
        type: str
        default: ""
        description:
          - Raw HCL appended unchanged to the end of C(agent.hcl) for options
            the role does not expose.
          - The role does not validate it. Invalid HCL, or a block that
            duplicates one the role writes, stops the agent from starting
            after the restart.
