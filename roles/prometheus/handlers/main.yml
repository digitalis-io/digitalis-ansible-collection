---
- name: Restart prometheus
  listen: "Restart prometheus"
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
    name: prometheus
    state: restarted
  register: prometheus_restarted
  when: prometheus_enable_service | bool

- name: Reload prometheus
  listen: "Reload prometheus"
  become: true
  ansible.builtin.systemd:
    name: prometheus
    state: reloaded
  when:
    - prometheus_enable_service | bool
    - prometheus_restarted is not defined
