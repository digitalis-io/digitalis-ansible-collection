---
- name: Create Prometheus data directory
  ansible.builtin.file:
    path: "{{ prometheus_db_dir }}"
    state: directory
    owner: "{{ prometheus_system_user }}"
    group: "{{ prometheus_system_group }}"
    mode: "0755"
  become: true
  tags:
    - prometheus_configure

- name: Create Prometheus configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_system_user }}"
    group: "{{ prometheus_system_group }}"
    mode: "0775"
  loop:
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_config_dir }}/consoles"
    - "{{ prometheus_config_dir }}/console_libraries"
    - "{{ prometheus_config_dir }}/rules"
    - "{{ prometheus_config_dir }}/file_sd"
    - "{{ prometheus_config_dir }}/scrape_configs"
  become: true
  tags:
    - prometheus_configure

- name: Propagate console templates and libraries
  ansible.builtin.copy:
    src: "{{ prometheus_local_cache_path }}/{{ item }}"
    dest: "{{ prometheus_config_dir }}"
    mode: "0644"
    owner: "{{ prometheus_system_user }}"
    group: "{{ prometheus_system_group }}"
  loop:
    - console_libraries
    - consoles
  become: true
  notify: Restart prometheus
  when: prometheus_version is version('3.0.0', '<')
  tags:
    - prometheus_configure

- name: Deploy alerting rules file
  ansible.builtin.template:
    src: ansible_managed.yml.j2
    dest: "{{ prometheus_config_dir }}/rules/ansible_managed.yml"
    owner: "{{ prometheus_system_user }}"
    group: "{{ prometheus_system_group }}"
    mode: "0640"
    validate: "{{ prometheus_binary_install_dir }}/promtool check rules %s"
  when:
    - prometheus_alert_rules != []
    - not prometheus_agent_mode
  become: true
  notify: Reload prometheus
  tags:
    - prometheus_configure

- name: Copy custom alerting rule files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ prometheus_config_dir }}/rules/"
    owner: "{{ prometheus_system_user }}"
    group: "{{ prometheus_system_group }}"
    mode: "0640"
    validate: "{{ prometheus_binary_install_dir }}/promtool check rules %s"
  loop: "{{ prometheus_alert_rules_files | map('ansible.builtin.fileglob') | flatten | map('ansible.builtin.realpath') }}"
  when: not prometheus_agent_mode
  become: true
  notify: Reload prometheus
  tags:
    - prometheus_configure

- name: Deploy Prometheus configuration
  ansible.builtin.template:
    src: "{{ prometheus_config_file }}"
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    force: true
    owner: "{{ prometheus_system_user }}"
    group: "{{ prometheus_system_group }}"
    mode: "0640"
    validate: "{{ prometheus_binary_install_dir }}/promtool check config %s"
  no_log: "{{ false if (lookup('env', 'CI')) or (lookup('env', 'MOLECULE_PROVISIONER_NAME')) else true }}"
  become: true
  notify: Reload prometheus
  tags:
    - prometheus_configure

- name: Configure file-based service discovery targets
  ansible.builtin.copy:
    content: |
      {{ item.value | to_nice_yaml(indent=2, sort_keys=False) }}
    dest: "{{ prometheus_config_dir }}/file_sd/{{ item.key }}.yml"
    force: true
    owner: "{{ prometheus_system_user }}"
    group: "{{ prometheus_system_group }}"
    mode: "0640"
  loop: "{{ prometheus_targets | dict2items }}"
  when: prometheus_targets != {}
  become: true
  notify: Reload prometheus
  tags:
    - prometheus_configure

- name: Copy custom static target files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ prometheus_config_dir }}/file_sd/"
    force: true
    owner: "{{ prometheus_system_user }}"
    group: "{{ prometheus_system_group }}"
    mode: "0640"
  loop: "{{ prometheus_static_targets_files | map('ansible.builtin.fileglob') | flatten | map('ansible.builtin.realpath') }}"
  become: true
  notify: Reload prometheus
  tags:
    - prometheus_configure

- name: Copy custom scrape config files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ prometheus_config_dir }}/scrape_configs/"
    force: true
    owner: "{{ prometheus_system_user }}"
    group: "{{ prometheus_system_group }}"
    mode: "0640"
  loop: "{{ prometheus_scrape_config_files | map('ansible.builtin.fileglob') | flatten | map('ansible.builtin.realpath') }}"
  become: true
  notify: Reload prometheus
  tags:
    - prometheus_configure

- name: Deploy web config
  ansible.builtin.template:
    src: web_config.yml.j2
    dest: "{{ prometheus_config_dir }}/web_config.yml"
    owner: "{{ prometheus_system_user }}"
    group: "{{ prometheus_system_group }}"
    mode: "0640"
  become: true
  notify: Restart prometheus
  when: >-
    [prometheus_web_config.tls_server_config,
     prometheus_web_config.http_server_config,
     prometheus_web_config.basic_auth_users]
    | map('length') | select('gt', 0) | list is any
  tags:
    - prometheus_configure
