---
- name: Converge
  hosts: all
  vars:
    prometheus_external_labels:
      environment: molecule
      region: test
    prometheus_scrape_configs:
      - job_name: prometheus
        metrics_path: /metrics
        static_configs:
          - targets:
              - "localhost:9090"
      - job_name: node_exporter
        static_configs:
          - targets:
              - "localhost:9100"
            labels:
              env: test
  roles:
    - role: prometheus
