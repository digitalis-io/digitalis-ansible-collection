---
- name: Verify Prometheus installation
  hosts: all
  gather_facts: false
  tasks:
    - name: Check prometheus binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/prometheus
      register: prometheus_bin
      failed_when: not prometheus_bin.stat.exists

    - name: Check promtool binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/promtool
      register: promtool_bin
      failed_when: not promtool_bin.stat.exists

    - name: Check prometheus user exists
      ansible.builtin.getent:
        database: passwd
        key: prometheus

    - name: Check prometheus group exists
      ansible.builtin.getent:
        database: group
        key: prometheus

    - name: Check configuration file exists with correct permissions
      ansible.builtin.stat:
        path: /etc/prometheus/prometheus.yml
      register: config_file
      failed_when: >
        not config_file.stat.exists or
        config_file.stat.mode != '0640'

    - name: Check data directory exists with correct ownership
      ansible.builtin.stat:
        path: /var/lib/prometheus
      register: data_dir
      failed_when: >
        not data_dir.stat.isdir or
        data_dir.stat.pw_name != 'prometheus'

    - name: Check systemd unit file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/prometheus.service
      register: unit_file
      failed_when: not unit_file.stat.exists

    - name: Check configuration directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: config_dirs
      failed_when: not config_dirs.stat.isdir
      loop:
        - /etc/prometheus/rules
        - /etc/prometheus/file_sd
        - /etc/prometheus/scrape_configs

    - name: Validate configuration with promtool
      ansible.builtin.command:
        cmd: /usr/local/bin/promtool check config /etc/prometheus/prometheus.yml
      changed_when: false

    - name: Read prometheus configuration
      ansible.builtin.slurp:
        src: /etc/prometheus/prometheus.yml
      register: prom_config

    - name: Verify configuration content
      ansible.builtin.assert:
        that:
          - "'scrape_interval' in (prom_config.content | b64decode)"
          - "'environment' in (prom_config.content | b64decode)"
          - "'node_exporter' in (prom_config.content | b64decode)"
        fail_msg: "Prometheus configuration is missing expected content"

    - name: Read prometheus systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/prometheus.service
      register: prom_unit

    - name: Verify systemd unit content
      ansible.builtin.assert:
        that:
          - "'User=prometheus' in (prom_unit.content | b64decode)"
          - "'--storage.tsdb.retention.time=30d' in (prom_unit.content | b64decode)"
          - "'NoNewPrivileges=true' in (prom_unit.content | b64decode)"
          - "'PrivateDevices=true' in (prom_unit.content | b64decode)"
          - "'ProtectHome=true' in (prom_unit.content | b64decode)"
        fail_msg: "Systemd unit file missing expected configuration"

    - name: Check prometheus service is enabled
      ansible.builtin.systemd:
        name: prometheus
      register: service_status
      failed_when: service_status.status.UnitFileState != 'enabled'
      when: prometheus_enable_service | default(true) | bool

    - name: Check prometheus service is running
      ansible.builtin.systemd:
        name: prometheus
      register: service_running
      failed_when: service_running.status.ActiveState != 'active'
      when: prometheus_enable_service | default(true) | bool

    - name: Check prometheus is listening on configured port
      ansible.builtin.wait_for:
        port: 9090
        timeout: 30
      when: prometheus_enable_service | default(true) | bool
