---
# Runs after the databases exist because privileges need the database objects.
- name: Grant privileges to PostgreSQL roles
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    priv: "{{ item.priv }}"
    db: "{{ item.db | default(omit) }}"
    login_user: "{{ postgres_cluster_user }}"
    login_unix_socket: "{{ postgres_cluster_unix_socket_directory }}"
    port: "{{ postgres_cluster_port }}"
    state: present
  loop: "{{ postgres_cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.state | default('present') == 'present'
    - item.priv is defined
  no_log: "{{ postgres_cluster_users_no_log }}"
  become: true
  become_user: "{{ postgres_cluster_user }}"
  tags: [postgres_cluster_users]

- name: Remove PostgreSQL roles
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    login_user: "{{ postgres_cluster_user }}"
    login_unix_socket: "{{ postgres_cluster_unix_socket_directory }}"
    port: "{{ postgres_cluster_port }}"
    state: absent
  loop: "{{ postgres_cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.state | default('present') == 'absent'
  no_log: "{{ postgres_cluster_users_no_log }}"
  become: true
  become_user: "{{ postgres_cluster_user }}"
  tags: [postgres_cluster_users]
