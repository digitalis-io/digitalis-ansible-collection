---
# yamllint disable rule:line-length
argument_specs:
  main:
    short_description: Deploy a highly available PostgreSQL cluster with Patroni.
    description:
      - Installs PostgreSQL from the PGDG repositories, Patroni in a virtual environment, an Apache ZooKeeper ensemble (or uses an existing one), pgBackRest and optionally HAProxy, pgAudit and pgAgent, on Red Hat Enterprise Linux (and rebuilds), Debian and Ubuntu. Creates roles and databases on the primary.
    author: Digitalis.io
    options:
      postgres_cluster_version:
        type: int
        default: 16
        choices: [14, 15, 16, 17]
        description: Major PostgreSQL version to install, 14 to 17. The packages come from the PostgreSQL project repositories (PGDG), not the distribution. The version is part of the data directory (`<data_directory>/<version>/main`) and of the default pgBackRest stanza name, so changing it on a running cluster creates a new, empty cluster instead of upgrading; use a major upgrade procedure for that.
      postgres_cluster_name:
        type: str
        default: postgres
        description: Patroni cluster name (the `scope`). Every node of one cluster uses the same value. It becomes the key prefix in ZooKeeper, so two clusters sharing one ZooKeeper ensemble need different names. Changing it on a running cluster makes the nodes form a new cluster.
      postgres_cluster_nodes:
        type: list
        elements: str
        default: '{{ groups[''postgres_cluster''] | default([]) }}'
        description: Inventory hostnames of the PostgreSQL nodes. The role must run on every host in this list and only on those hosts. The default is the inventory group `postgres_cluster`. The order is not significant for PostgreSQL but fixes the ZooKeeper IDs, so append new nodes and do not reorder.
      postgres_cluster_primary:
        type: str
        default: '{{ postgres_cluster_nodes | first | default('''') }}'
        description: 'Node that bootstraps the cluster on the first run: it initialises the database (or restores the latest backup), creates the pgBackRest stanza and takes the first full backup before the other nodes start. After the cluster exists this setting has no effect and any node can be the primary. Defaults to the first host of `postgres_cluster_nodes`.'
      postgres_cluster_address:
        type: str
        default: '{{ ansible_facts[''default_ipv4''][''address''] }}'
        description: IP address of this node that the other nodes, clients and HAProxy use to reach PostgreSQL, the Patroni REST API and ZooKeeper. Set it per host (in host_vars) when the node has several interfaces or sits behind NAT. Defaults to the IPv4 address of the default route interface.
      postgres_cluster_user:
        type: str
        default: postgres
        description: Operating system account that owns the data directory and runs PostgreSQL and Patroni. Created by the role if missing. It is also the name of the PostgreSQL superuser created by initdb. Changing it after the first run is not supported.
      postgres_cluster_group:
        type: str
        default: postgres
        description: Primary group of `postgres_cluster_user`. Created by the role if missing.
      postgres_cluster_user_uid:
        type: str
        default: ''
        description: Fixed numeric UID for `postgres_cluster_user`, for hosts where the UID must match a network share or a policy. Empty lets the system choose. Only used when the account is created.
      postgres_cluster_user_groups:
        type: list
        elements: str
        default: []
        description: Additional groups for `postgres_cluster_user`, for example a group that may read the logs. The groups must already exist. They are appended to the existing memberships.
      postgres_cluster_data_directory:
        type: path
        default: /pg_data
        description: Parent directory for the PostgreSQL data. The cluster lives in `<data_directory>/<version>/main`. Created with mode 0750 owned by `postgres_cluster_user`. Put it on its own volume. It must not be the parent of `postgres_cluster_wal_directory`.
      postgres_cluster_wal_directory:
        type: path
        default: ''
        description: Directory for the write-ahead log, passed to initdb as `--waldir`. Empty keeps the WAL inside the data directory. Use it to put WAL on a faster or separate volume. It only takes effect when the database is initialised, and must be an absolute path outside `postgres_cluster_data_directory`; the role refuses a path inside it.
      postgres_cluster_unix_socket_directory:
        type: path
        default: /var/run/postgresql
        description: Directory of the PostgreSQL Unix socket. Used by Patroni, pgBackRest and the role's database tasks, which connect as `postgres_cluster_user` with peer authentication. Created if missing.
      postgres_cluster_log_directory:
        type: path
        default: /var/log/postgresql
        description: Directory for the PostgreSQL log files, one file per weekday (`postgresql-Mon.log`, overwritten after a week). Created if missing.
      postgres_cluster_locale:
        type: str
        default: en_US.UTF-8
        description: Locale for the cluster, passed to initdb, and the default `lc_collate` and `lc_ctype` of databases in `postgres_cluster_databases`. On Red Hat the language packs are installed; on Debian and Ubuntu the locale is generated. Use `C.UTF-8` to avoid installing anything. Only takes effect when the database is initialised.
      postgres_cluster_port:
        type: int
        default: 5432
        description: TCP port of PostgreSQL on every node. Also the port HAProxy forwards to and the port written to the pgBackRest configuration.
      postgres_cluster_auth_method:
        type: str
        default: scram-sha-256
        choices: [scram-sha-256, md5]
        description: Password authentication method used in `pg_hba.conf` for the replication, rewind and loopback rules the role writes, and the `password_encryption` setting for new passwords. Prefer `scram-sha-256`. `md5` is only for old clients that cannot do SCRAM. Rules in `postgres_cluster_hba` are written as given.
      postgres_cluster_parameters:
        type: dict
        default: {}
        description: 'PostgreSQL settings (`postgresql.conf` parameters) as a dictionary, for example `max_connections: 300` or `shared_buffers: 4GB`. Merged over the role''s own settings, so a value given here wins. Written to the Patroni bootstrap section (used when the cluster is created) and to the local configuration, which Patroni applies on a reload. Settings Patroni controls cluster-wide (`max_connections`, `max_wal_senders`, `max_worker_processes`, `wal_level`, ...) take effect on a running cluster only after `patronictl edit-config`, followed by a restart when PostgreSQL says so (`patronictl list` shows Pending restart). Do not set `shared_preload_libraries` when `postgres_cluster_pgaudit_enabled` is true unless you include `pgaudit`.'
      postgres_cluster_hba:
        type: list
        elements: str
        default: []
        description: Extra `pg_hba.conf` lines, appended after the role's own rules, in the usual format, for example `hostssl all app 10.0.0.0/24 scram-sha-256`. Without entries here only local connections and the cluster nodes can connect. Applied when Patroni reloads its configuration; no restart is needed.
      postgres_cluster_synchronous_replication:
        type: bool
        default: true
        description: 'With two or more nodes, require a commit to be confirmed by one standby (`synchronous_commit = on`, `synchronous_standby_names = ANY 1 (...)`). This lowers the risk of losing commits on failover but does not remove it: Patroni promotes the standby with the least lag, which is not always one that confirmed the last commit. Writes block while no standby is reachable (for example with a two node cluster and one node down). Set to `false` for asynchronous replication, which keeps accepting writes but may lose the last transactions on failover. Ignored for a single node.'
      postgres_cluster_patroni_port:
        type: int
        default: 8008
        description: Port of the Patroni REST API. HAProxy health checks and the role's own checks use it. The API listens on `postgres_cluster_address` only.
      postgres_cluster_patroni_venv:
        type: path
        default: /opt/patroni
        description: Directory of the Python virtual environment holding Patroni. A virtual environment keeps Patroni away from the system Python, which distributions block from pip installs. The systemd unit points here, and `patroni` and `patronictl` are linked into `/usr/local/bin`.
      postgres_cluster_patroni_version:
        type: str
        default: ''
        description: Patroni version to install, for example `4.0.5`. Empty installs the latest release at the time of the first run and leaves it alone afterwards. Pin it in production and upgrade nodes one at a time. Needs Patroni 3.0 or later.
      postgres_cluster_patroni_ttl:
        type: int
        default: 30
        description: Seconds the leader lock lives in ZooKeeper before the cluster elects a new leader. Together with `loop_wait` and `retry_timeout` it sets the failover time; keep `loop_wait + 2 * retry_timeout <= ttl`. Applied when the cluster is created; change it afterwards with `patronictl edit-config`.
      postgres_cluster_patroni_loop_wait:
        type: int
        default: 10
        description: Seconds between Patroni's health loops. Applied when the cluster is created; change it afterwards with `patronictl edit-config`.
      postgres_cluster_patroni_retry_timeout:
        type: int
        default: 10
        description: Seconds Patroni retries ZooKeeper and PostgreSQL operations before it demotes the leader. Applied when the cluster is created; change it afterwards with `patronictl edit-config`.
      postgres_cluster_patroni_maximum_lag_on_failover:
        type: int
        default: 1048576
        description: Maximum replication lag, in bytes, of a standby that may be promoted. A standby further behind is not elected. Applied when the cluster is created; change it afterwards with `patronictl edit-config`.
      postgres_cluster_patroni_rest_user:
        type: str
        default: ''
        description: User name for HTTP basic authentication of the Patroni REST API's write operations (switchover, restart, reload). Read-only endpoints such as the HAProxy health checks stay open. Empty disables authentication. Set together with `postgres_cluster_patroni_rest_password`.
      postgres_cluster_patroni_rest_password:
        type: str
        default: ''
        no_log: true
        description: Password for `postgres_cluster_patroni_rest_user`. Set together with the user. Written to `/etc/patroni.yml`. The API uses HTTP Basic authentication, so enable `postgres_cluster_ssl_enabled` as well, or the password crosses the network in clear text.
      postgres_cluster_patroni_rest_allowlist:
        type: list
        elements: str
        default: []
        description: 'Addresses and networks, for example `10.0.9.0/24`, that may reach the Patroni REST API in addition to the cluster nodes, which are always allowed. Empty allows every address. Set it to your administration hosts and load balancers: the API can change the cluster configuration and trigger failovers. HAProxy runs on the nodes and is covered by the node list; an external load balancer that checks `/primary` must be listed.'
      postgres_cluster_ssl_enabled:
        type: bool
        default: false
        description: 'Encrypt client, replication and Patroni REST API connections with TLS. The role then uses `hostssl` rules for replication and rewind, and HTTPS for the REST API. Needs a certificate and key at `postgres_cluster_ssl_cert` and `postgres_cluster_ssl_key`: either create them with `postgres_cluster_ssl_self_signed` or place them on the host before the role runs. Existing connections are not interrupted but Patroni must be restarted to start using TLS.'
      postgres_cluster_ssl_self_signed:
        type: bool
        default: false
        description: Create a private key and a self-signed certificate on each node (valid ten years, with the host name, the node address and 127.0.0.1 as names). Good for tests and private networks; clients cannot verify these certificates against a CA. Needs `postgres_cluster_ssl_enabled`. Existing files are left alone.
      postgres_cluster_ssl_cert:
        type: path
        default: /etc/postgres_cluster/ssl/server.crt
        description: Path of the server certificate (PEM) on each node. Created when `postgres_cluster_ssl_self_signed` is true; otherwise it must exist before the role runs, or the role stops. Used by PostgreSQL and the Patroni REST API. Include intermediate certificates in the file.
      postgres_cluster_ssl_key:
        type: path
        default: /etc/postgres_cluster/ssl/server.key
        description: Path of the private key (PEM) matching `postgres_cluster_ssl_cert`. Mode 0600 and owned by `postgres_cluster_user`, set by the role.
      postgres_cluster_ssl_ca:
        type: path
        default: ''
        description: Path of a CA bundle (PEM) on each node. Empty omits it. When set, PostgreSQL gets it as `ssl_ca_file`, the REST API as `cafile`, and `patronictl` uses it to verify the REST API certificate; the role does not create or copy the file.
      postgres_cluster_ssl_ciphers:
        type: str
        default: HIGH:!aNULL
        description: OpenSSL cipher list for PostgreSQL TLS connections (`ssl_ciphers`). The default allows strong ciphers only.
      postgres_cluster_manage_zookeeper:
        type: bool
        default: true
        description: Install and configure an Apache ZooKeeper ensemble on `postgres_cluster_zookeeper_nodes` as the cluster's distributed configuration store. Set to `false` to use an existing ensemble listed in `postgres_cluster_zookeeper_connect`; the role then installs no Java or ZooKeeper.
      postgres_cluster_zookeeper_nodes:
        type: list
        elements: str
        default: '{{ postgres_cluster_nodes }}'
        description: Hosts that run ZooKeeper, a subset of `postgres_cluster_nodes`. Use 1 node for tests, 3 for production (it tolerates one failure) and an odd number in general. The position in the list is the ZooKeeper ID, so only append to it. Defaults to every node.
      postgres_cluster_zookeeper_connect:
        type: list
        elements: str
        default: []
        description: Client addresses of an existing ZooKeeper ensemble as `host:port`, for example `zk1.example.com:2181`. Required, and only used, when `postgres_cluster_manage_zookeeper` is `false`.
      postgres_cluster_zookeeper_version:
        type: str
        default: 3.9.6
        description: 'ZooKeeper release to download, for example `3.9.6`. Only used with `postgres_cluster_manage_zookeeper`. Changing it downloads the new archive but does not replace an install in `postgres_cluster_zookeeper_install_dir`: remove the directory and run the role to upgrade.'
      postgres_cluster_zookeeper_download_url:
        type: str
        default: https://archive.apache.org/dist/zookeeper/zookeeper-{{ postgres_cluster_zookeeper_version }}/apache-zookeeper-{{ postgres_cluster_zookeeper_version }}-bin.tar.gz
        description: URL of the ZooKeeper binary archive. The default is the Apache archive, which keeps old releases. Point it at an internal mirror for hosts without internet access.
      postgres_cluster_zookeeper_checksum:
        type: str
        default: sha512:{{ postgres_cluster_zookeeper_download_url }}.sha512
        description: Checksum the downloaded archive must match, in the `algorithm:value` or `algorithm:url` form of `ansible.builtin.get_url`. The default fetches the SHA-512 file published next to the archive. Set to the checksum itself when you use a mirror. Empty disables the check, which is not recommended.
      postgres_cluster_zookeeper_install_dir:
        type: path
        default: /opt/zookeeper
        description: Directory the ZooKeeper archive is extracted to. Owned by root.
      postgres_cluster_zookeeper_data_dir:
        type: path
        default: /var/lib/zookeeper
        description: ZooKeeper data directory, holding the snapshots, transaction logs, `myid` file and logs. Owned by the `zookeeper` user.
      postgres_cluster_zookeeper_conf_dir:
        type: path
        default: /etc/zookeeper
        description: Directory of `zoo.cfg`.
      postgres_cluster_zookeeper_client_port:
        type: int
        default: 2181
        description: Port Patroni uses to talk to ZooKeeper. ZooKeeper listens on `postgres_cluster_address` only.
      postgres_cluster_zookeeper_leader_port:
        type: int
        default: 2888
        description: Port ZooKeeper followers use to connect to the leader. Open it between the ZooKeeper nodes.
      postgres_cluster_zookeeper_election_port:
        type: int
        default: 3888
        description: Port ZooKeeper nodes use for leader election. Open it between the ZooKeeper nodes.
      postgres_cluster_zookeeper_user_uid:
        type: str
        default: ''
        description: Fixed numeric UID for the `zookeeper` account. Empty lets the system choose. Only used when the account is created.
      postgres_cluster_java_package:
        type: str
        default: ''
        description: Package that provides Java for ZooKeeper. Empty picks OpenJDK 17, or OpenJDK 21 on Debian 13 and Red Hat 10, where 17 is not packaged.
      postgres_cluster_pgbackrest_stanza:
        type: str
        default: main_{{ postgres_cluster_version }}
        description: 'pgBackRest stanza name, the label of this cluster in the backup repository. The default includes the PostgreSQL version. Keep it unchanged for the life of the cluster: a new name starts a new, empty backup set. Clusters that share a bucket or repository must use different stanzas, or a new cluster finds the other one''s backups and restores them.'
      postgres_cluster_pgbackrest_repo_type:
        type: str
        default: posix
        choices: [posix, s3, azure, cifs]
        description: Where pgBackRest stores backups and archived WAL. `posix` is a directory on each node (`postgres_cluster_pgbackrest_repo_path`, which can be an NFS mount you manage); it is not shared, so with several nodes only the node that takes the backup holds them. `s3` and `azure` use object storage shared by all nodes and are the choice for production clusters. `cifs` mounts an SMB share. The settings of the chosen type are required and checked before the host is changed.
      postgres_cluster_pgbackrest_repo_path:
        type: path
        default: /var/lib/pgbackrest
        description: Repository directory for the `posix` type, or the mount point of the share for the `cifs` type. Created with mode 0750 owned by `postgres_cluster_user` for `posix`. Ignored for `s3` and `azure`.
      postgres_cluster_pgbackrest_repo_shared:
        type: bool
        default: false
        description: Confirms that with several nodes the `posix` repository is one directory seen by all nodes, for example an NFS mount at `postgres_cluster_pgbackrest_repo_path`. The role refuses several nodes with a `posix` repository unless this is `true`, because a per-node directory has the stanza only on the first node and WAL archiving stops after a failover. Ignored for other types and for a single node.
      postgres_cluster_pgbackrest_retention_full:
        type: int
        default: 3
        description: Number of full backups to keep, with the WAL they need. Older backups are expired by the next backup run. The role takes only the first full backup; schedule later backups yourself, for example with cron or a systemd timer running `pgbackrest backup`.
      postgres_cluster_pgbackrest_backup_standby:
        type: bool
        default: false
        description: Run backups on a standby to spare the primary (`backup-standby=y`). Needs at least two nodes and SSH access between the nodes as `postgres_cluster_user`, which the role sets up with an ed25519 key, `authorized_keys` and `known_hosts` entries; sshd must be running and allow the account. Also makes each node's pgBackRest configuration list its peers, so `pgbackrest check` contacts all nodes.
      postgres_cluster_pgbackrest_log_level:
        type: str
        default: info
        choices: ['off', error, warn, info, detail, debug, trace]
        description: 'pgBackRest file log level: `off`, `error`, `warn`, `info`, `detail`, `debug` or `trace`. Logs go to `/var/log/pgbackrest`.'
      postgres_cluster_pgbackrest_archive_push_queue_max:
        type: str
        default: 5GB
        description: Maximum size of WAL waiting to be archived (`archive-push-queue-max`), for example `5GB`. When the repository is unreachable and the queue exceeds this, pgBackRest drops WAL to protect the primary's disk, which breaks point-in-time recovery until the next full backup. Raise it for long outages of the repository.
      postgres_cluster_pgbackrest_spool_path:
        type: path
        default: /var/spool/pgbackrest
        description: Directory for the asynchronous WAL archive queue (`archive-async=y`). Created if missing. Keep it on a volume with room for `postgres_cluster_pgbackrest_archive_push_queue_max`.
      postgres_cluster_pgbackrest_s3_bucket:
        type: str
        default: ''
        description: S3 bucket for the repository. Required for the `s3` type. The role does not create the bucket.
      postgres_cluster_pgbackrest_s3_region:
        type: str
        default: ''
        description: AWS region, or the region name your S3-compatible service expects, for example `eu-west-2`. Required for the `s3` type.
      postgres_cluster_pgbackrest_s3_endpoint:
        type: str
        default: ''
        description: 'S3 endpoint host name. Empty uses `s3.<region>.amazonaws.com`. Set it for an S3-compatible service such as MinIO or Ceph, usually with `postgres_cluster_pgbackrest_s3_uri_style: path`.'
      postgres_cluster_pgbackrest_s3_key:
        type: str
        default: ''
        no_log: true
        description: S3 access key ID. Empty uses `postgres_cluster_pgbackrest_s3_key_type` (by default the instance role). Set together with the secret.
      postgres_cluster_pgbackrest_s3_key_secret:
        type: str
        default: ''
        no_log: true
        description: S3 secret access key. Set together with the key. Written to `/etc/pgbackrest.conf` (mode 0600). Keep it in ansible-vault or a secrets manager.
      postgres_cluster_pgbackrest_s3_key_type:
        type: str
        default: auto
        choices: [auto, web-id]
        description: 'How pgBackRest finds S3 credentials when no key is set: `auto` uses the EC2 instance metadata role, `web-id` uses a web identity token. Ignored when `postgres_cluster_pgbackrest_s3_key` is set.'
      postgres_cluster_pgbackrest_s3_uri_style:
        type: str
        default: host
        choices: [host, path]
        description: 'S3 URI style: `host` for AWS (`bucket.endpoint`), `path` for most S3-compatible services (`endpoint/bucket`).'
      postgres_cluster_pgbackrest_s3_verify_tls:
        type: bool
        default: true
        description: Verify the TLS certificate of the S3 endpoint. Set to `false` only for a test service with a self-signed certificate.
      postgres_cluster_pgbackrest_azure_account:
        type: str
        default: ''
        description: Azure storage account name. Required for the `azure` type.
      postgres_cluster_pgbackrest_azure_container:
        type: str
        default: ''
        description: Azure blob container for the repository. Required for the `azure` type. The role does not create it.
      postgres_cluster_pgbackrest_azure_key:
        type: str
        default: ''
        no_log: true
        description: Azure shared key or SAS token, depending on `postgres_cluster_pgbackrest_azure_key_type`. Required for the `azure` type. Written to `/etc/pgbackrest.conf` (mode 0600). Keep it in ansible-vault or a secrets manager.
      postgres_cluster_pgbackrest_azure_key_type:
        type: str
        default: shared
        choices: [shared, sas, auto]
        description: 'Kind of Azure credential in `postgres_cluster_pgbackrest_azure_key`: `shared` for the account key, `sas` for a shared access signature.'
      postgres_cluster_pgbackrest_azure_endpoint:
        type: str
        default: blob.core.windows.net
        description: Azure blob endpoint. Change it for sovereign clouds or an emulator.
      postgres_cluster_pgbackrest_azure_uri_style:
        type: str
        default: host
        choices: [host, path]
        description: 'Azure URI style: `host` for the public cloud, `path` for emulators and some private endpoints.'
      postgres_cluster_pgbackrest_azure_verify_tls:
        type: bool
        default: true
        description: Verify the TLS certificate of the Azure endpoint. Set to `false` only for an emulator with a self-signed certificate.
      postgres_cluster_pgbackrest_cifs_src:
        type: str
        default: ''
        description: SMB share to mount at `postgres_cluster_pgbackrest_repo_path`, for example `//fileserver.example.com/pgbackups`. Required for the `cifs` type. The role installs `cifs-utils` and the extra kernel modules for `iocharset=utf8`, and mounts the share persistently in `/etc/fstab`.
      postgres_cluster_pgbackrest_cifs_username:
        type: str
        default: ''
        description: User name for the SMB share. Required for the `cifs` type. Stored with the password in a root-only credentials file.
      postgres_cluster_pgbackrest_cifs_password:
        type: str
        default: ''
        no_log: true
        description: Password for the SMB share. Required for the `cifs` type. Keep it in ansible-vault or a secrets manager.
      postgres_cluster_pgaudit_enabled:
        type: bool
        default: false
        description: Install pgAudit, add it to `shared_preload_libraries` and create the extension in the `postgres` database on the primary. The setting reaches PostgreSQL through Patroni, so a running cluster needs a restart (`patronictl restart`) after you enable it; create the extension in other databases yourself.
      postgres_cluster_pgaudit_packages:
        type: list
        elements: str
        default: []
        description: Packages that provide pgAudit. Empty picks the PGDG package for `postgres_cluster_version` (`pgaudit16_14`, `pgaudit17_15`, `pgaudit_16`, `pgaudit_17`) on Red Hat and `postgresql-<version>-pgaudit` on Debian and Ubuntu.
      postgres_cluster_pgaudit_config:
        type: dict
        default: {pgaudit.log: 'ddl,role', pgaudit.log_catalog: 'on', pgaudit.log_level: log, pgaudit.log_parameter: 'on', pgaudit.log_relation: 'off', pgaudit.log_statement_once: 'off'}
        description: 'pgAudit settings as a dictionary of `pgaudit.*` parameters, written to the PostgreSQL configuration. The default logs DDL and role changes with parameters, without relation detail. Add `pgaudit.log: "ddl,role,write"` to log writes. The `pgaudit.log` value is a comma separated list of `read`, `write`, `function`, `role`, `ddl`, `misc`.'
      postgres_cluster_pgagent_enabled:
        type: bool
        default: false
        description: Install and run pgAgent, the job scheduler for PostgreSQL, on Red Hat family systems only (the Debian package ships no service). Creates a superuser role, the `pgagent` extension on the primary and a service on every node. The service only works on the primary, so after a failover it must be restarted on the new primary.
      postgres_cluster_pgagent_user:
        type: str
        default: pgagent
        description: PostgreSQL role pgAgent connects as. Created as superuser on the primary, because jobs run with its privileges.
      postgres_cluster_pgagent_password:
        type: str
        default: ''
        no_log: true
        description: Password of the pgAgent role. Required (8 characters or more) when pgAgent is enabled. Written to the pgAgent `.pgpass` file. Keep it in ansible-vault or a secrets manager.
      postgres_cluster_pgagent_database:
        type: str
        default: postgres
        description: Database pgAgent connects to and where its `pgagent` extension lives.
      postgres_cluster_haproxy_enabled:
        type: bool
        default: false
        description: Install HAProxy on every node and expose a write port that always reaches the primary and a read port that reaches the standbys, using Patroni's REST API for health checks. Clients then need no knowledge of failover. On Red Hat with SELinux enforcing the role sets the booleans and port labels HAProxy needs.
      postgres_cluster_haproxy_bind_address:
        type: str
        default: '*'
        description: Address HAProxy's read and write ports listen on. `*` listens on all interfaces; use an address to limit exposure.
      postgres_cluster_haproxy_write_port:
        type: int
        default: 5000
        description: Port that routes to the current primary.
      postgres_cluster_haproxy_read_port:
        type: int
        default: 5001
        description: Port that routes to the standbys. When no standby is healthy the port refuses connections.
      postgres_cluster_haproxy_maxconn:
        type: int
        default: 200
        description: Maximum concurrent connections for the whole HAProxy process (`global maxconn`).
      postgres_cluster_haproxy_server_maxconn:
        type: int
        default: 1200
        description: Maximum concurrent connections HAProxy opens to one PostgreSQL node. Keep it at or below PostgreSQL's `max_connections`.
      postgres_cluster_haproxy_stats_listen:
        type: str
        default: 127.0.0.1:7000
        description: Address and port of HAProxy's statistics page, `host:port`. Bind it to loopback unless the network is trusted.
      postgres_cluster_haproxy_prometheus_enabled:
        type: bool
        default: true
        description: Serve Prometheus metrics from HAProxy's built-in exporter at `/metrics`.
      postgres_cluster_haproxy_prometheus_listen_address:
        type: str
        default: localhost:8405
        description: Address and port of the Prometheus exporter, `host:port`. Ignored when the exporter is disabled.
      postgres_cluster_databases:
        type: list
        elements: dict
        default: []
        description: 'Databases to create on the primary after the cluster is up. Each item needs `name`. Removed databases need `state: absent`; the role never drops a database that is merely missing from the list.'
        options:
          name:
            type: str
            required: true
            description: Database name.
          owner:
            type: str
            description: Owning role. Defaults to `postgres_cluster_user`. The role must exist, so create it in `postgres_cluster_users`; users are created before databases.
          lc_collate:
            type: str
            description: Collation. Defaults to `postgres_cluster_locale`.
          lc_ctype:
            type: str
            description: Character classification. Defaults to `postgres_cluster_locale`.
          encoding:
            type: str
            description: Encoding. Defaults to `UTF-8`.
          template:
            type: str
            description: Template database. Defaults to `template0`, which allows the locale and encoding above.
          state:
            type: str
            choices: [present, absent]
            description: '`present` creates the database, `absent` drops it with its data. Defaults to `present`.'
      postgres_cluster_users:
        type: list
        elements: dict
        default: []
        description: 'PostgreSQL roles to create on the primary after the cluster is up. Each item needs `name`. A role is created or updated; with `state: absent` it is dropped after databases and privileges are handled. Roles are not removed when missing from the list.'
        options:
          name:
            type: str
            required: true
            description: Role name.
          password:
            type: str
            no_log: true
            description: Password in clear text; PostgreSQL stores a hash. Without it the role has no password and cannot log in with one.
          role_attr_flags:
            type: str
            description: Comma separated role attributes, for example `CREATEDB,NOLOGIN`, `SUPERUSER` or `REPLICATION`.
          roles:
            type: list
            elements: str
            description: Roles this role becomes a member of. The roles must already exist.
          priv:
            type: str
            description: Privileges on the database `db` (default `postgres`), for example `CONNECT`. Add table privileges after a `/` as `table:PRIVS`, for example `CONNECT/orders:SELECT,INSERT`; write a table outside the `public` schema as `schema.table`. Applied with `postgresql_privs` after the databases exist.
          db:
            type: str
            description: Database that `priv` applies to.
          state:
            type: str
            choices: [present, absent]
            description: '`present` creates the role, `absent` drops it. Defaults to `present`.'
      postgres_cluster_users_no_log:
        type: bool
        default: true
        description: Hide role tasks' arguments and results from the Ansible output, because they contain passwords. Set to `false` only when debugging with test data.
      postgres_cluster_superuser_password:
        type: str
        required: true
        no_log: true
        description: Password of the PostgreSQL superuser, used by Patroni to manage the database. Required. Must be at least 8 characters and not a placeholder such as `changeme`; the role refuses to run otherwise. Written to `/etc/patroni.yml` (mode 0600). Keep it in ansible-vault or a secrets manager. Changing it later does not change the role inside a running cluster; change it with `ALTER ROLE` and then here.
      postgres_cluster_replication_password:
        type: str
        required: true
        no_log: true
        description: Password of the `replicator` role that standbys use to stream WAL. Required, same rules as `postgres_cluster_superuser_password`. Written to `/etc/patroni.yml`. Keep it in ansible-vault or a secrets manager.
      postgres_cluster_rewind_password:
        type: str
        required: true
        no_log: true
        description: Password of the `rewind` role Patroni uses for `pg_rewind` after a failover. Required, same rules as `postgres_cluster_superuser_password`. Written to `/etc/patroni.yml`. Keep it in ansible-vault or a secrets manager.
