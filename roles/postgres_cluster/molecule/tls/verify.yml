---
- name: Verify
  hosts: all
  gather_facts: true
  vars:
    postgres_cluster_version: 16
    pg_bin_dir: "{{ '/usr/pgsql-' ~ postgres_cluster_version ~ '/bin' if ansible_facts['os_family'] == 'RedHat' else '/usr/lib/postgresql/' ~ postgres_cluster_version ~ '/bin' }}"
    psql: "{{ pg_bin_dir }}/psql -X -A -t -v ON_ERROR_STOP=1"
    addr: "{{ ansible_facts['default_ipv4']['address'] }}"
  tasks:
    # Scenario: Connections are encrypted
    - name: Check the TLS state of a session through HAProxy
      ansible.builtin.command: >-
        {{ psql }} "host={{ addr }} port=6000 user=tlsapp dbname=tlsdb sslmode=require" -c "SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()"
      environment:
        PGPASSWORD: molecule-tlsapp-secret
      register: postgres_cluster_verify_tls_session
      changed_when: false

    - name: Assert the session is encrypted
      ansible.builtin.assert:
        that: postgres_cluster_verify_tls_session.stdout | trim == 't'
        quiet: true

    - name: Connect without TLS
      ansible.builtin.command: >-
        {{ psql }} "host={{ addr }} port=6000 user=tlsapp dbname=tlsdb sslmode=disable" -c "SELECT 1"
      environment:
        PGPASSWORD: molecule-tlsapp-secret
      register: postgres_cluster_verify_plain_session
      failed_when: false
      changed_when: false

    - name: Assert the plain connection was rejected
      ansible.builtin.assert:
        that:
          - postgres_cluster_verify_plain_session.rc != 0
          - "'no pg_hba.conf entry' in postgres_cluster_verify_plain_session.stderr"
        quiet: true

    # Scenario: The Patroni API is served over HTTPS and protects changes
    - name: Ask the Patroni API for its state over HTTPS
      ansible.builtin.uri:
        url: "https://{{ addr }}:8008/patroni"
        validate_certs: false
      register: postgres_cluster_verify_api_state

    - name: Assert the API reports a running primary
      ansible.builtin.assert:
        that: postgres_cluster_verify_api_state.json.state == 'running'
        quiet: true

    - name: Reload without credentials
      ansible.builtin.uri:
        url: "https://{{ addr }}:8008/reload"
        method: POST
        validate_certs: false
        status_code: [401]

    - name: Reload with credentials
      ansible.builtin.uri:
        url: "https://{{ addr }}:8008/reload"
        method: POST
        validate_certs: false
        url_username: admin
        url_password: molecule-rest-secret
        force_basic_auth: true
        status_code: [202]
      no_log: true

    # Scenario: The certificate and key are protected
    - name: Stat the key
      ansible.builtin.stat:
        path: /etc/postgres_cluster/ssl/server.key
      register: postgres_cluster_verify_key_stat

    - name: Assert the key is private
      ansible.builtin.assert:
        that:
          - postgres_cluster_verify_key_stat.stat.mode == '0600'
          - postgres_cluster_verify_key_stat.stat.pw_name == 'postgres'
        quiet: true

    - name: Read the certificate names
      ansible.builtin.command: openssl x509 -in /etc/postgres_cluster/ssl/server.crt -noout -ext subjectAltName
      register: postgres_cluster_verify_cert_names
      changed_when: false

    - name: Assert the certificate names the address
      ansible.builtin.assert:
        that: "('IP Address:' ~ addr) in postgres_cluster_verify_cert_names.stdout"
        quiet: true

    # Scenario: The custom layout is honoured
    - name: Query the layout from PostgreSQL
      ansible.builtin.command: >-
        {{ psql }} -p 5433 -c "SELECT current_setting('port'), datcollate, (SELECT substr(rolpassword, 1, 3) FROM pg_authid WHERE rolname = 'tlsapp') FROM pg_database WHERE datname = 'tlsdb'"
      become: true
      become_user: postgres
      register: postgres_cluster_verify_layout
      changed_when: false

    - name: Assert the port, locale and hash type
      ansible.builtin.assert:
        that: postgres_cluster_verify_layout.stdout | trim == '5433|C.UTF-8|md5'
        quiet: true

    - name: Look for WAL files in the WAL directory
      ansible.builtin.find:
        paths: /pg_wal
        patterns: "0000*"
      register: postgres_cluster_verify_wal_files

    - name: Assert WAL is written there and the data directory links to it
      ansible.builtin.assert:
        that: postgres_cluster_verify_wal_files.files | length > 0
        quiet: true

    - name: Stat the WAL link in the data directory
      ansible.builtin.stat:
        path: /pg_data/16/main/pg_wal
      register: postgres_cluster_verify_wal_link

    - name: Assert the data directory links to the WAL directory
      ansible.builtin.assert:
        that:
          - postgres_cluster_verify_wal_link.stat.islnk
          - postgres_cluster_verify_wal_link.stat.lnk_source == '/pg_wal'
        quiet: true

    # Scenario: The Patroni API is served over HTTPS and protects changes
    - name: Run patronictl against the protected API
      ansible.builtin.command: /usr/local/bin/patronictl -c /etc/patroni.yml list --format json
      register: postgres_cluster_verify_protected_list
      changed_when: false

    - name: Assert patronictl authenticated and saw the leader
      ansible.builtin.assert:
        that: (postgres_cluster_verify_protected_list.stdout | from_json | selectattr('Role', 'equalto', 'Leader') | list | length) == 1
        quiet: true
