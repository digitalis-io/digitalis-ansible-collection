---
# Builds a cluster, fills it, loses the database and the cluster state, then
# applies the role again so it rebuilds the cluster from the backup.
- name: Build the cluster
  hosts: all
  gather_facts: true
  roles:
    - role: postgres_cluster

- name: Put data in the database and back it up
  hosts: all
  gather_facts: false
  vars:
    postgres_cluster_version: 16
    pg_bin_dir: "{{ '/usr/pgsql-' ~ postgres_cluster_version ~ '/bin' if ansible_facts['os_family'] == 'RedHat' else '/usr/lib/postgresql/' ~ postgres_cluster_version ~ '/bin' }}"
  tasks:
    - name: Create a table with a row
      ansible.builtin.command: >-
        {{ pg_bin_dir }}/psql -X -v ON_ERROR_STOP=1 -d appdb
        -c "CREATE TABLE precious (id int PRIMARY KEY, note text); INSERT INTO precious VALUES (1, 'survives the rebuild')"
      become: true
      become_user: postgres
      changed_when: true

    - name: Take a differential backup that includes the row
      ansible.builtin.command: pgbackrest --stanza=main_{{ postgres_cluster_version }} backup --type=diff
      become: true
      become_user: postgres
      changed_when: true

- name: Lose the database and the cluster state
  hosts: all
  gather_facts: false
  tasks:
    - name: Stop Patroni, which stops PostgreSQL
      ansible.builtin.systemd:
        name: patroni
        state: stopped

    - name: Empty the data directory
      ansible.builtin.shell: rm -rf /pg_data/16/main && mkdir -m 0700 /pg_data/16/main && chown postgres:postgres /pg_data/16/main
      changed_when: true

    - name: Remove the cluster from ZooKeeper
      ansible.builtin.command: /opt/zookeeper/bin/zkCli.sh -server {{ ansible_facts['default_ipv4']['address'] }}:2181 deleteall /service/molecule-restore
      changed_when: true

- name: Rebuild the cluster from the backup
  hosts: all
  gather_facts: true
  roles:
    - role: postgres_cluster
