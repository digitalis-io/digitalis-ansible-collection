---
dependency:
  name: galaxy
  options:
    ignore-errors: true
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/molecule/requirements.yml
driver:
  name: docker
platforms:
  - name: ${MOLECULE_INSTANCE_NAME:-"postgres-cluster"}
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-rockylinux9}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - postgres_cluster
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        # sudo cannot authenticate root in privileged containers on some Docker hosts.
        ansible_become_method: su
        # Test-only secrets; the real ones belong in ansible-vault.
        postgres_cluster_superuser_password: molecule-superuser-secret
        postgres_cluster_replication_password: molecule-replication-secret
        postgres_cluster_rewind_password: molecule-rewind-secret
        postgres_cluster_name: molecule
        postgres_cluster_pgaudit_enabled: true
        postgres_cluster_haproxy_enabled: true
        # The Debian pgagent package ships no service.
        postgres_cluster_pgagent_enabled: "{{ ansible_facts['os_family'] == 'RedHat' }}"
        postgres_cluster_pgagent_password: molecule-pgagent-secret
        postgres_cluster_hba:
          - host appdb app 0.0.0.0/0 scram-sha-256
        postgres_cluster_parameters:
          max_connections: 150
        postgres_cluster_databases:
          - name: appdb
            owner: app
        postgres_cluster_users:
          - name: app
            password: molecule-app-secret
            priv: CONNECT
            db: appdb
          - name: readonly
            password: molecule-readonly-secret
            role_attr_flags: NOSUPERUSER,NOCREATEDB
            roles: [pg_read_all_data]
          - name: tmpuser
            state: absent
