---
_openbao_apt_keyring: /etc/apt/keyrings/openbao.asc

_openbao_package_name:
  Debian: "openbao={{ openbao_version }}"
  RedHat: "openbao-{{ openbao_version }}"

_openbao_package: "{{ _openbao_package_name[ansible_facts['os_family']] }}"

_openbao_supported_os_families:
  - Debian
  - RedHat

_openbao_config_file: /etc/openbao/openbao.hcl

_openbao_plugin_types:
  - secret
  - auth
  - database

_openbao_plugin_keys:
  - type
  - name
  - image
  - command
  - version
  - sha256sum
  - binary_name
  - args
  - env

_openbao_init_environment:
  BAO_ADDR: "{{ openbao_init_address }}"
  BAO_SKIP_VERIFY: "{{ openbao_init_skip_verify | bool | ternary('true', 'false') }}"
