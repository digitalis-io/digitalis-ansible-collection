---
# Version of the OpenBao package to install. Must exist in the
# pkgs.openbao.org repository for the target architecture.
openbao_version: "2.7.1"

# Manage the upstream package repository. Set to false when the package is
# served from an internal mirror that is already configured on the host.
openbao_manage_repository: true

# Location of the OpenBao package signing key.
openbao_gpg_key_url: "https://openbao.org/assets/openbao-gpg-pub-20240618.asc"

# Validate TLS certificates when downloading the signing key.
openbao_validate_certs: true

openbao_apt_repository_uri: "https://pkgs.openbao.org/deb"
openbao_apt_repository_suite: "stable"
openbao_apt_repository_components: "main"

openbao_yum_repository_baseurl: "https://pkgs.openbao.org/rpm/$basearch"

# Manage the openbao server service. When false the role only installs the
# package and leaves the service as the package created it (disabled and
# stopped on a fresh install). The package ships a working default
# configuration: pebbledb storage and self-signed TLS on 0.0.0.0:8200.
openbao_service_manage: false
openbao_service_enabled: true
openbao_service_state: started

# Render /etc/openbao/openbao.hcl from the options below. When false the role
# leaves the configuration shipped by the package untouched. The defaults
# match the packaged storage, listener and UI settings. The rendered file is
# checked with "bao operator validate-config" before it replaces the current
# one, and a change restarts the service when openbao_service_manage is true,
# openbao_service_state is started and the service was already running.
openbao_config_manage: false

openbao_ui: true

# Advertised addresses, for example https://openbao1.example.com:8200 and
# https://openbao1.example.com:8201. Empty strings are omitted. Raft storage
# needs openbao_cluster_addr.
openbao_api_addr: ""
openbao_cluster_addr: ""

# Storage backend type and its options, rendered as storage "<type>" { ... }.
openbao_storage_type: pebbledb
openbao_storage_config:
  path: /opt/openbao/data

# Listeners. Each item is rendered as listener "<type>" { ... } with every
# other key written as an option; type defaults to tcp. Nested mappings become
# nested blocks.
openbao_listeners:
  - type: tcp
    address: "0.0.0.0:8200"
    tls_cert_file: /opt/openbao/tls/tls.crt
    tls_key_file: /opt/openbao/tls/tls.key

# Options for the telemetry block, for example
# {prometheus_retention_time: 24h, disable_hostname: true}. Empty omits it.
openbao_telemetry: {}

# Plugins declared in the configuration. Each item needs type (secret, auth
# or database), name, version and exactly one of:
#   image:   OCI image reference, downloaded into openbao_plugin_directory.
#            Pin it by digest (image:tag@sha256:...) or set sha256sum.
#   command: binary already present in openbao_plugin_directory.
# Optional keys: sha256sum, binary_name, args (list), env (list of KEY=value).
# Requires openbao_config_manage. Example:
#   openbao_plugins:
#     - type: auth
#       name: aws
#       image: ghcr.io/openbao/openbao-plugin-auth-aws
#       version: v0.1.1
#       binary_name: openbao-plugin-auth-aws
#       sha256sum: 3b03fb12b8cedd9d2d83ea282a32a4f70147c93a927af5937c9b081525830db2
#     - type: secret
#       name: aws
#       image: ghcr.io/openbao/openbao-plugin-secrets-aws
#       version: v0.3.1
#       binary_name: openbao-plugin-secrets-aws
#       sha256sum: 3eac1f04852876dd1ead9bfd555cafa805af6c87b64b65c3b4a85ff65e98712c
openbao_plugins: []

# Server plugin options, rendered and the directory created only when
# openbao_plugins is not empty.
openbao_plugin_directory: /opt/openbao/plugins
openbao_plugin_auto_download: true
openbao_plugin_auto_register: true
openbao_plugin_download_behavior: fail

# Raw HCL appended to the server configuration, for example a seal stanza.
openbao_extra_config: ""

# Initialise the cluster with "bao operator init" on the first host of the
# play, only when it is not initialised yet. Requires openbao_service_manage
# and a started service. The unseal keys and root token are written to
# openbao_init_output_file (root only, mode 0600) on that host. Move them to a
# secrets manager and remove the file. The cluster is left sealed unless
# auto-unseal is configured; other nodes must be unsealed separately.
openbao_init: false
openbao_init_secret_shares: 5
openbao_init_secret_threshold: 3
openbao_init_output_file: /root/openbao-init.json

# Address used by the init commands and whether to skip TLS verification, which
# the packaged self-signed certificate needs.
openbao_init_address: "https://127.0.0.1:8200"
openbao_init_skip_verify: true
