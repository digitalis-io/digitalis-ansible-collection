---
argument_specs:
  main:
    short_description: Install the OpenBao server package.
    description:
      - Configures the upstream OpenBao package repository and installs the
        OpenBao package on Red Hat Enterprise Linux (and rebuilds), Debian and
        Ubuntu.
    author: Digitalis.io
    options:
      openbao_version:
        type: str
        default: "2.7.1"
        description: Package version to install, for example C(2.7.1).
      openbao_manage_repository:
        type: bool
        default: true
        description: Configure the pkgs.openbao.org repository. Disable when an internal mirror is already configured.
      openbao_gpg_key_url:
        type: str
        default: "https://openbao.org/assets/openbao-gpg-pub-20240618.asc"
        description: URL of the package signing key.
      openbao_validate_certs:
        type: bool
        default: true
        description: Validate TLS certificates when downloading the signing key.
      openbao_apt_repository_uri:
        type: str
        default: "https://pkgs.openbao.org/deb"
        description: APT repository URI.
      openbao_apt_repository_suite:
        type: str
        default: stable
        description: APT repository suite.
      openbao_apt_repository_components:
        type: str
        default: main
        description: APT repository components.
      openbao_yum_repository_baseurl:
        type: str
        default: "https://pkgs.openbao.org/rpm/$basearch"
        description: YUM/DNF repository base URL.
      openbao_service_manage:
        type: bool
        default: false
        description: Manage the C(openbao) server service using the two options below.
      openbao_service_enabled:
        type: bool
        default: true
        description: Enable the C(openbao) server service at boot.
      openbao_service_state:
        type: str
        default: started
        choices: [started, stopped, restarted]
        description: State of the C(openbao) server service.
