---
- name: Init | Wait for the server to answer
  ansible.builtin.command: bao operator init -status
  environment: "{{ openbao_init_environment }}"
  register: openbao_init_status
  until: openbao_init_status.rc in [0, 2]
  retries: 30
  delay: 2
  changed_when: false
  failed_when: openbao_init_status.rc not in [0, 2]
  run_once: true

- name: Init | Initialise the cluster
  ansible.builtin.command: >-
    bao operator init -format=json
    -key-shares={{ openbao_init_secret_shares }}
    -key-threshold={{ openbao_init_secret_threshold }}
  environment: "{{ openbao_init_environment }}"
  register: openbao_init_result
  when: openbao_init_status.rc == 2
  changed_when: true
  no_log: true
  run_once: true

- name: Init | Store the unseal keys and root token
  ansible.builtin.copy:
    content: "{{ openbao_init_result.stdout }}"
    dest: "{{ openbao_init_output_file }}"
    owner: root
    group: root
    mode: "0600"
  when: openbao_init_result is not skipped
  no_log: true
  run_once: true
